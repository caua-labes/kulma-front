<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulma — Avaliar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fluxo.css">
</head>
<body>
<!-- Avaliação: só depois de pedido entregue ou reserva retirada (4.7). Pedido avalia loja, produto e motorista; reserva, só loja e produto. A nota do produto soma todas as sedes da empresa. -->
<main class="app app--fluxo">

    <div class="topbar">
        <form class="search search--bar" role="search" action="busca.html">
            <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input class="search__input" type="search" name="q" placeholder="Buscar na sua cidade" aria-label="Buscar produtos, lojas ou ofertas na sua cidade">
            <span class="search__sep" aria-hidden="true"></span>
            <a class="search__place" href="index.html#cidade" aria-label="Cidade: Blumenau, SC. Trocar cidade">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="search__place-text"><span>Blumenau</span><span class="search__place-uf">SC</span></span>
            </a>
        </form>
    </div>

    <header class="page-head">
        <a class="page-head__back" href="pedido.html" aria-label="Voltar para o pedido"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
            <h1 class="page-head__title">Avaliar</h1>
            <p class="page-head__sub">Pedido nº 4821 · Casa Firme</p>
        </div>
    </header>

    <section class="box" aria-label="Notas">
        <div class="rate-block">
            <div class="rate-block__who">
                <span class="box__logo has-img"><img class="media-img" src="img/lojas/casa-firme.jpg" alt="" loading="lazy"></span>
                <div><p class="rate-block__name">Casa Firme</p><p class="rate-block__role">Loja</p></div>
            </div>
            <div class="rate" role="radiogroup"><input class="ui-toggle" type="radio" name="nota-loja" id="nota-loja-5"><label for="nota-loja-5" aria-label="5 de 5">★</label><input class="ui-toggle" type="radio" name="nota-loja" id="nota-loja-4"><label for="nota-loja-4" aria-label="4 de 5">★</label><input class="ui-toggle" type="radio" name="nota-loja" id="nota-loja-3"><label for="nota-loja-3" aria-label="3 de 5">★</label><input class="ui-toggle" type="radio" name="nota-loja" id="nota-loja-2"><label for="nota-loja-2" aria-label="2 de 5">★</label><input class="ui-toggle" type="radio" name="nota-loja" id="nota-loja-1"><label for="nota-loja-1" aria-label="1 de 5">★</label></div>
        </div>
        <div class="rate-block">
            <div class="rate-block__who">
                <span class="box__logo has-img"><img class="media-img" src="img/produtos/trena.jpg" alt="" loading="lazy"></span>
                <div><p class="rate-block__name">Trena</p><p class="rate-block__role">Produto</p></div>
            </div>
            <div class="rate" role="radiogroup"><input class="ui-toggle" type="radio" name="nota-produto" id="nota-produto-5"><label for="nota-produto-5" aria-label="5 de 5">★</label><input class="ui-toggle" type="radio" name="nota-produto" id="nota-produto-4"><label for="nota-produto-4" aria-label="4 de 5">★</label><input class="ui-toggle" type="radio" name="nota-produto" id="nota-produto-3"><label for="nota-produto-3" aria-label="3 de 5">★</label><input class="ui-toggle" type="radio" name="nota-produto" id="nota-produto-2"><label for="nota-produto-2" aria-label="2 de 5">★</label><input class="ui-toggle" type="radio" name="nota-produto" id="nota-produto-1"><label for="nota-produto-1" aria-label="1 de 5">★</label></div>
        </div>
        <div class="rate-block">
            <div class="rate-block__who">
                <span class="box__logo profile__avatar" style="width:36px;height:36px;font-size:14px">M</span>
                <div><p class="rate-block__name">Marcos</p><p class="rate-block__role">Motorista da ronda</p></div>
            </div>
            <div class="rate" role="radiogroup"><input class="ui-toggle" type="radio" name="nota-motorista" id="nota-motorista-5"><label for="nota-motorista-5" aria-label="5 de 5">★</label><input class="ui-toggle" type="radio" name="nota-motorista" id="nota-motorista-4"><label for="nota-motorista-4" aria-label="4 de 5">★</label><input class="ui-toggle" type="radio" name="nota-motorista" id="nota-motorista-3"><label for="nota-motorista-3" aria-label="3 de 5">★</label><input class="ui-toggle" type="radio" name="nota-motorista" id="nota-motorista-2"><label for="nota-motorista-2" aria-label="2 de 5">★</label><input class="ui-toggle" type="radio" name="nota-motorista" id="nota-motorista-1"><label for="nota-motorista-1" aria-label="1 de 5">★</label></div>
        </div>
    </section>

    <section class="box" aria-label="Comentário">
        <label class="field">
            <span class="field__label">Quer contar mais?</span>
            <textarea class="field__input" placeholder="O que achou do produto e da entrega (opcional)"></textarea>
        </label>
    </section>

    <div class="actions">
        <a class="btn btn--primary" href="pedido.html">Enviar avaliação</a>
    </div>

    <nav class="tabbar" aria-label="Navegação principal">
        <a class="tab" href="index.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg></span>
            Início
        </a>
        <a class="tab" href="busca.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg></span>
            Explorar
        </a>
        <a class="tab" href="carrinho.html" aria-label="Sacola, 4 itens">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="tab__count">4</span></span>
            Sacola
        </a>
        <a class="tab is-active" href="pedidos.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg></span>
            Pedidos
        </a>
        <a class="tab" href="index.html#conta" aria-label="Conta, 2 notificações não lidas">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="tab__dot"></span></span>
            Conta
        </a>
    </nav>

</main>
</body>
</html>
