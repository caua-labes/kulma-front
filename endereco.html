<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulma — Adicionar endereço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fluxo.css">
</head>
<body>
<!-- Adicionar endereço: o cliente guarda vários endereços (address com client_id) e escolhe um por grupo de loja no checkout. Campos sem "name": nada é enviado. -->
<main class="app app--fluxo">

    <div class="topbar">
        <form class="search search--bar" role="search" action="busca.html">
            <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input class="search__input" type="search" name="q" placeholder="Buscar na sua cidade" aria-label="Buscar produtos, lojas ou ofertas na sua cidade">
            <span class="search__sep" aria-hidden="true"></span>
            <a class="search__place" href="index.html#cidade" aria-label="Cidade: Blumenau, SC. Trocar cidade">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="search__place-text"><span>Blumenau</span><span class="search__place-uf">SC</span></span>
            </a>
        </form>
    </div>

    <header class="page-head">
        <a class="page-head__back" href="checkout.html" aria-label="Voltar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
            <h1 class="page-head__title">Endereço de entrega</h1>
            <p class="page-head__sub">Escolha um salvo ou adicione outro</p>
        </div>
    </header>

    <section class="box" aria-label="Endereços salvos">
        <a class="order" href="checkout.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <div class="order__body">
                <p class="order__title">Casa</p>
                <p class="order__meta">Rua das Palmeiras, 210 · Victor Konder</p>
            </div>
            <span class="status status--ok">Em uso</span>
        </a>
        <a class="order" href="checkout.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <div class="order__body">
                <p class="order__title">Trabalho</p>
                <p class="order__meta">Rua XV de Novembro, 800 · Centro</p>
            </div>
            <svg class="order__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
    </section>

    <section class="box" aria-labelledby="novo-end">
        <h2 class="box__title" id="novo-end" style="margin-bottom:12px">Novo endereço</h2>
        <form class="form" action="checkout.html">
            <div class="field-row">
                <label class="field">
                    <span class="field__label">CEP</span>
                    <input class="field__input" type="text" inputmode="numeric" placeholder="89000-000" autocomplete="off">
                </label>
                <label class="field">
                    <span class="field__label">Número</span>
                    <input class="field__input" type="text" inputmode="numeric" placeholder="210" autocomplete="off">
                </label>
            </div>
            <label class="field">
                <span class="field__label">Rua</span>
                <input class="field__input" type="text" placeholder="Rua, avenida…" autocomplete="off">
            </label>
            <label class="field">
                <span class="field__label">Complemento</span>
                <input class="field__input" type="text" placeholder="Apto, bloco (opcional)" autocomplete="off">
            </label>
            <div class="field-row">
                <label class="field">
                    <span class="field__label">Bairro</span>
                    <input class="field__input" type="text" placeholder="Bairro" autocomplete="off">
                </label>
                <label class="field">
                    <span class="field__label">Cidade</span>
                    <input class="field__input" type="text" value="Blumenau, SC" readonly>
                </label>
            </div>
            <div class="field">
                <span class="field__label">Nome do endereço</span>
                <div class="pick">
                    <input class="ui-toggle" type="radio" name="apelido" id="ap-casa" checked>
                    <label class="pick__opt" for="ap-casa">Casa</label>
                    <input class="ui-toggle" type="radio" name="apelido" id="ap-trab">
                    <label class="pick__opt" for="ap-trab">Trabalho</label>
                    <input class="ui-toggle" type="radio" name="apelido" id="ap-outro">
                    <label class="pick__opt" for="ap-outro">Outro</label>
                </div>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Salvar endereço</button>
        </form>
    </section>

    <nav class="tabbar" aria-label="Navegação principal">
        <a class="tab" href="index.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg></span>
            Início
        </a>
        <a class="tab" href="busca.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg></span>
            Explorar
        </a>
        <a class="tab is-active" href="carrinho.html" aria-label="Sacola, 4 itens">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="tab__count">4</span></span>
            Sacola
        </a>
        <a class="tab" href="pedidos.html">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg></span>
            Pedidos
        </a>
        <a class="tab" href="index.html#conta" aria-label="Conta, 2 notificações não lidas">
            <span class="tab__icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="tab__dot"></span></span>
            Conta
        </a>
    </nav>

</main>
</body>
</html>
